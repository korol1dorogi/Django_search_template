{% extends "admin/change_list.html" %}
{% load i18n %}

{% block object-tools-items %}

    {# ---- Кнопка очистки всех данных ---- #}
    <li>
        <form method="post" action="wipe/"
              onsubmit="return confirm('Удалить ВСЕ документы, термины и связи?\n\nПользователи и служебные таблицы Django останутся нетронутыми.\n\nОтменить невозможно.');"
              style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="button"
                    style="background:#7b1fa2; color:#fff; border:none; padding:6px 14px; border-radius:4px; cursor:pointer;">
                🗑&nbsp;Сбросить все данные
            </button>
        </form>
    </li>

    {{ block.super }}
{% endblock %}
